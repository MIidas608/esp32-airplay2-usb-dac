<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'>
<meta name='theme-color' content='#111113'>
<title>AirPlay 接收器</title>
<style>
:root{
  --bg:#111113;--card:#1a1a1d;--border:#2a2a2e;--text:#ededef;--text2:#9a9aa0;
  --accent:#3b82f6;--accent-hover:#2f6fd6;--danger:#e5484d;--ok:#2fbf71;
  --input-bg:#111113;--sel-bg:rgba(59,130,246,.16);
}
[data-theme="light"]{
  --bg:#fafafa;--card:#ffffff;--border:#e5e5e5;--text:#18181b;--text2:#71717a;
  --accent:#2563eb;--accent-hover:#1d4ed8;--danger:#dc2626;--ok:#16a34a;
  --input-bg:#fafafa;--sel-bg:rgba(37,99,235,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:10px 14px calc(76px + env(safe-area-inset-bottom))}
/* 顶部栏 */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 14px}
.topbar h1{font-size:19px;font-weight:700}
#theme-btn{background:var(--card);border:1px solid var(--border);border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text)}
/* 卡片 */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.card h2{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:12px;text-transform:uppercase;letter-spacing:.6px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row label{font-size:13px;color:var(--text2)}
.row span{font-size:14px;font-weight:500;text-align:right;word-break:break-all}
/* 表单 */
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px}
input[type=text],input[type=password]{width:100%;padding:11px 13px;background:var(--input-bg);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:15px}
input:focus{outline:none;border-color:var(--accent)}
select{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:9px;color:var(--text);padding:10px 12px;font-size:14px}
select option{background:var(--bg)}
/* 按钮 */
.btn{display:inline-block;padding:11px 18px;border:none;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s;text-decoration:none;text-align:center;background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn:active{opacity:.7}
.btn-primary{background:var(--accent);color:#fff;border-color:transparent}
.btn-primary:hover{background:var(--accent-hover)}
.btn-danger{background:var(--danger);color:#fff;border-color:transparent}
.btn-block{width:100%;margin-top:8px}
.btn:disabled{opacity:.4}
/* WiFi 列表 */
.wifi-list{max-height:200px;overflow-y:auto;margin:10px 0;border-radius:9px}
.wifi-item{padding:11px 13px;background:var(--input-bg);border:1px solid var(--border);margin-bottom:5px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.wifi-item.sel{border-color:var(--accent);background:var(--sel-bg)}
.wifi-item .ssid{font-weight:500;font-size:14px}
.wifi-item .rssi{font-size:12px;color:var(--text2)}
/* 状态信息 */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info-item{background:var(--input-bg);border:1px solid var(--border);padding:10px 12px;border-radius:9px}
.info-item label{font-size:11px;color:var(--text2);display:block;margin-bottom:3px}
.info-item span{font-size:13px;font-weight:600;word-break:break-all}
/* 消息 */
.msg{padding:9px 12px;border-radius:8px;margin-top:10px;font-size:13px}
.msg.ok{background:rgba(47,191,113,.15);color:var(--ok)}
.msg.err{background:rgba(229,72,77,.15);color:var(--danger)}
.msg.info{background:var(--sel-bg);color:var(--accent)}
/* 提示条 */
.hint{background:var(--sel-bg);border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:12px;color:var(--text2);margin-bottom:12px;line-height:1.6}
/* EQ 行式滑块 */
.eq-row{display:flex;align-items:center;gap:12px;padding:9px 0}
.eq-row .freq{font-size:13px;color:var(--text2);width:52px;flex-shrink:0;font-variant-numeric:tabular-nums}
.eq-row .val{font-size:13px;font-weight:600;width:38px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.eq-row input[type=range]{flex:1;accent-color:var(--accent)}
/* 开关 */
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.switch-row .lab{font-size:14px}
.switch{position:relative;width:46px;height:26px;flex-shrink:0;cursor:pointer}
.switch input{opacity:0;width:0;height:0}
.switch .track{position:absolute;inset:0;background:var(--border);border-radius:13px;transition:.2s}
.switch .track:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+.track{background:var(--accent)}
.switch input:checked+.track:before{transform:translateX(20px)}
/* 日志（始终深色终端风格） */
#log{background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:12px;height:52vh;overflow-y:auto;font-family:'SF Mono',Consolas,monospace;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-all;color:#c9d1d9}
#log .a30{color:#484f58}#log .a31{color:#f85149}#log .a32{color:#3fb950}#log .a33{color:#d29922}#log .a34{color:#58a6ff}#log .a35{color:#bc8cff}#log .a36{color:#39c5cf}#log .a37{color:#c9d1d9}
#log .a90{color:#6e7681}#log .a91{color:#ff7b72}#log .a92{color:#56d364}#log .a93{color:#e3b341}#log .a94{color:#79c0ff}#log .a95{color:#d2a8ff}#log .a96{color:#56d4dd}#log .a97{color:#f0f6fc}
.log-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.log-head h2{margin-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--danger);display:inline-block;flex-shrink:0}
.dot.ok{background:var(--ok)}
.log-tool{display:flex;gap:8px;margin-bottom:10px}
.log-tool .btn{flex:1;padding:8px;font-size:12px}
/* 测速 */
.st-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px}
.st-row .lbl{color:var(--text2)}
.st-row .val{font-weight:600;font-variant-numeric:tabular-nums}
.big{font-size:24px;font-weight:700;color:var(--accent)}
.unit{font-size:13px;color:var(--text2);margin-left:3px}
.st-log{font-family:ui-monospace,monospace;font-size:11px;color:var(--text2);max-height:120px;overflow-y:auto;padding:8px;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;white-space:pre-wrap;margin-top:10px}
.file-row{display:flex;gap:10px;align-items:center}
.file-name{flex:1;font-size:13px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slider-row{display:flex;align-items:center;gap:12px}
.slider-row input[type=range]{flex:1;accent-color:var(--accent)}
.slider-row span{font-size:13px;color:var(--text2);min-width:40px;text-align:right}
/* 底部菜单 */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;color:var(--text2);font-size:11px;cursor:pointer;background:none;border:none}
.tab .ic{font-size:20px;line-height:1}
.tab.on{color:var(--accent)}
.page{display:none}
.page.on{display:block}
</style></head><body>
<div class='wrap'>
<div class='topbar'><h1>AirPlay 接收器</h1>
<button id='theme-btn' onclick='toggleTheme()' title='切换深浅色'>🌙</button></div>

<!-- 状态 -->
<div class='page on' id='page-status'>
<div class='card'><h2>连接</h2>
<div class='row'><label>网络</label><span id='st-net'>-</span></div>
<div class='row'><label>IP 地址</label><span id='st-ip'>-</span></div>
<div class='row'><label>WiFi 信号</label><span id='st-rssi'>-</span></div>
<div class='row'><label>USB DAC</label><span id='st-dac'>-</span></div>
<div class='row'><label>播放状态</label><span id='st-play'>-</span></div>
</div>
<div class='card'><h2>设备信息</h2>
<div class='info-grid'>
<div class='info-item'><label>设备名称</label><span id='info-name'>-</span></div>
<div class='info-item'><label>固件版本</label><span id='info-fw'>-</span></div>
<div class='info-item'><label>运行时间</label><span id='info-uptime'>-</span></div>
<div class='info-item'><label>剩余内存</label><span id='info-heap'>-</span></div>
<div class='info-item'><label>WiFi 信道</label><span id='info-chan'>-</span></div>
<div class='info-item'><label>MAC 地址</label><span id='info-mac'>-</span></div>
</div></div>
<div class='card'><h2>网络测速</h2>
<div class='hint'>⚠️ 测速会占用网络带宽，<b>播放中请勿测速</b>，否则可能导致音乐卡顿。</div>
<div class='st-row'><span class='lbl'>延迟（Ping）</span><span class='val'><span id='p-avg'>—</span></span></div>
<div class='st-row'><span class='lbl'>下载速度</span><span class='val'><span class='big' id='dl-mbps'>0.00</span><span class='unit'>Mbit/s</span></span></div>
<div class='st-row'><span class='lbl'>上传速度</span><span class='val'><span class='big' id='ul-mbps'>0.00</span><span class='unit'>Mbit/s</span></span></div>
<div class='log-tool' style='margin-top:12px'>
<button class='btn' id='b-ping' onclick='runPing()'>测延迟</button>
<button class='btn' id='b-dl' onclick='runDownload()'>测下载</button>
<button class='btn' id='b-ul' onclick='runUpload()'>测上传</button>
</div>
<div class='st-log' id='st-log'></div>
<div id='st-msg'></div></div>
</div>

<!-- 网络 -->
<div class='page' id='page-wifi'>
<div class='card'><h2>WiFi 网络</h2>
<button class='btn btn-block' onclick='scanWiFi()'>扫描附近网络</button>
<div id='wifi-list' class='wifi-list'></div>
<div class='form-group'><label>网络名称（SSID）</label><input type='text' id='wifi-ssid' placeholder='输入或选择网络'></div>
<div class='form-group'><label>密码</label><input type='password' id='wifi-pass' placeholder='输入密码'></div>
<button class='btn btn-primary btn-block' onclick='saveWiFi()'>连接 WiFi</button>
<div id='wifi-msg'></div></div>
</div>

<!-- 均衡 -->
<div class='page' id='page-eq'>
<div class='card'><h2>均衡器</h2>
<div id='eq-sliders'></div>
<div class='log-tool'>
<button class='btn btn-primary' id='apply-btn' onclick='applyEQ()' disabled>应用</button>
<button class='btn' onclick='flatEQ()'>归零</button>
</div>
<div class='form-group' style='margin-top:14px'><label>预设</label>
<select id='preset-sel' onchange='loadPreset(this.value)'>
<option value=''>-- 选择预设 --</option>
<option value='bass_boost'>低音增强</option>
<option value='treble_boost'>高音增强</option>
<option value='v_shape'>V 型曲线</option>
<option value='vocal'>人声增强</option>
</select></div>
<div id='eq-msg'></div></div>
<div class='card'><h2>响度均衡</h2>
<div class='switch-row'><span class='lab'>自动响度补偿（音量低时增强低音/高音）</span>
<label class='switch'><input type='checkbox' id='loudness-cb' onchange='saveLoudness(this.checked)'><span class='track'></span></label></div>
<div id='loud-msg'></div></div>
</div>

<!-- 日志 -->
<div class='page' id='page-logs'>
<div class='card'><div class='log-head'><h2>系统日志</h2><span id='log-dot' class='dot' title='连接状态'></span></div>
<div class='log-tool'>
<button class='btn' id='log-clear' onclick='clearLog()'>清空</button>
<button class='btn' id='log-scroll' onclick='toggleScroll()'>自动滚动：开</button>
</div>
<div id='log'></div></div>
</div>

<!-- 设置 -->
<div class='page' id='page-settings'>
<div class='card'><h2>设备</h2>
<div class='form-group'><label>AirPlay 设备名称</label><input type='text' id='dev-name' placeholder='我的音箱'></div>
<button class='btn btn-primary btn-block' onclick='saveName()'>保存名称</button>
<div id='name-msg'></div>
<div class='form-group' style='margin-top:14px'><label for='led-brightness'>LED 亮度</label>
<div class='slider-row'><input type='range' id='led-brightness' min='0' max='255' value='128' oninput='document.getElementById("led-pct").textContent=Math.round(this.value/255*100)+"%"'>
<span id='led-pct'>50%</span></div></div>
<button class='btn btn-block' onclick='saveBrightness()'>保存亮度</button>
<div id='brightness-msg'></div>
<div id='chan-group'>
<div class='form-group' style='margin-top:14px'><label for='chan-mode' id='chan-label'>输出声道</label>
<select id='chan-mode' onchange='saveChannel()'>
<option value='0'>立体声</option>
<option value='1'>仅左声道</option>
<option value='2'>仅右声道</option>
<option value='3'>单声道（L+R）</option>
</select></div>
<div id='chan-msg'></div></div>
</div>
<div class='card'><h2>固件升级</h2>
<div class='file-row'><input type='file' id='fw-file' accept='.bin' style='display:none'>
<button class='btn' onclick='document.getElementById("fw-file").click()'>选择文件</button>
<span class='file-name' id='fw-name'>未选择文件</span></div>
<button class='btn btn-primary btn-block' id='ota-btn' onclick='startOTA()' disabled>上传并升级</button>
<div id='ota-msg'></div></div>
<div class='card'><h2>系统</h2>
<button class='btn btn-danger btn-block' onclick='restart()'>重启设备</button></div>
</div>
</div>

<!-- 底部菜单 -->
<div class='tabbar'>
<button class='tab on' id='tab-status' onclick='showPage("status")'><span class='ic'>🏠</span>状态</button>
<button class='tab' id='tab-wifi' onclick='showPage("wifi")'><span class='ic'>📶</span>网络</button>
<button class='tab' id='tab-eq' onclick='showPage("eq")'><span class='ic'>🎚️</span>均衡</button>
<button class='tab' id='tab-logs' onclick='showPage("logs")'><span class='ic'>📋</span>日志</button>
<button class='tab' id='tab-settings' onclick='showPage("settings")'><span class='ic'>⚙️</span>设置</button>
</div>

<script>
/* 主题切换 */
var theme=localStorage.getItem('theme')||'dark';
function applyTheme(t){
  theme=t;
  document.documentElement.setAttribute('data-theme',t==='light'?'light':'');
  document.getElementById('theme-btn').textContent=t==='light'?'🌙':'☀️';
  document.querySelector('meta[name=theme-color]').setAttribute('content',t==='light'?'#fafafa':'#111113');
  localStorage.setItem('theme',t);
}
function toggleTheme(){applyTheme(theme==='dark'?'light':'dark');}

/* 页面切换（日志懒加载） */
var activeTab='status';
function showPage(n){
  activeTab=n;
  ['status','wifi','eq','logs','settings'].forEach(function(k){
    document.getElementById('page-'+k).classList.toggle('on',k===n);
    document.getElementById('tab-'+k).classList.toggle('on',k===n);
  });
  if(n==='logs'){connectLogs();}else{disconnectLogs();}
}

/* 通用 */
function msg(id,txt,type){var e=document.getElementById(id);if(e){e.innerHTML='<div class="msg '+type+'">'+txt+'</div>';setTimeout(function(){e.innerHTML='';},4000);}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* 日志（WebSocket 懒加载） */
var ws=null,logAutoScroll=true,logMaxLines=2000;
var ansiRe=/\x1b\[([0-9;]*)m/g;
var ansiCls={'30':'a30','31':'a31','32':'a32','33':'a33','34':'a34','35':'a35','36':'a36','37':'a37','90':'a90','91':'a91','92':'a92','93':'a93','94':'a94','95':'a95','96':'a96','97':'a97'};
var letterCls={'E':'a31','W':'a33','I':'a32','D':'a30','V':'a30'};
var logEl=document.getElementById('log');
function atBottom(){return logEl.scrollHeight-logEl.scrollTop-logEl.clientHeight<40;}
logEl.addEventListener('scroll',function(){
  if(logAutoScroll&&!atBottom())setScroll(false);
  else if(!logAutoScroll&&atBottom())setScroll(true);
});
function setScroll(v){logAutoScroll=v;document.getElementById('log-scroll').textContent='自动滚动：'+(v?'开':'关');}
function toggleScroll(){setScroll(!logAutoScroll);if(logAutoScroll)logEl.scrollTop=logEl.scrollHeight;}
function clearLog(){logEl.innerHTML='';}
function colorize(text){
  var frag=document.createDocumentFragment();
  text.split('\n').forEach(function(line){
    if(!line)return;
    var wrap=document.createElement('span');
    var hasAnsi=ansiRe.test(line);ansiRe.lastIndex=0;
    if(hasAnsi){
      var last=0,cls=null,m;
      while((m=ansiRe.exec(line))!==null){
        if(m.index>last){var s=document.createElement('span');if(cls)s.className=cls;s.textContent=line.substring(last,m.index);wrap.appendChild(s);}
        var p=m[1].split(';');cls=null;
        for(var i=0;i<p.length;i++){if(ansiCls[p[i]])cls=ansiCls[p[i]];}
        last=ansiRe.lastIndex;
      }
      if(last<line.length){var s=document.createElement('span');if(cls)s.className=cls;s.textContent=line.substring(last);wrap.appendChild(s);}
    }else{
      var ch=line.charAt(0);if(letterCls[ch])wrap.className=letterCls[ch];wrap.textContent=line;
    }
    wrap.appendChild(document.createTextNode('\n'));frag.appendChild(wrap);
  });
  var follow=logAutoScroll&&atBottom();
  logEl.appendChild(frag);
  var trimmed=0;
  while(logEl.childNodes.length>logMaxLines+1){trimmed+=logEl.firstChild.offsetHeight||0;logEl.removeChild(logEl.firstChild);}
  if(follow)logEl.scrollTop=logEl.scrollHeight;
  else if(trimmed)logEl.scrollTop=Math.max(0,logEl.scrollTop-trimmed);
}
function connectLogs(){
  if(ws)return;
  ws=new WebSocket('ws://'+location.host+'/ws/logs');
  ws.onopen=function(){document.getElementById('log-dot').classList.add('ok');};
  ws.onclose=function(){ws=null;document.getElementById('log-dot').classList.remove('ok');if(activeTab==='logs')setTimeout(connectLogs,2000);};
  ws.onmessage=function(e){colorize(e.data);};
}
function disconnectLogs(){if(ws){ws.close();ws=null;}}

/* WiFi */
async function scanWiFi(){
  var l=document.getElementById('wifi-list');l.innerHTML='<div class="msg info">扫描中...</div>';
  try{var r=await fetch('/api/wifi/scan');var d=await r.json();
    if(d.success&&d.networks.length>0){l.innerHTML='';d.networks.forEach(function(n){
      var i=document.createElement('div');i.className='wifi-item';
      i.innerHTML='<span class="ssid">'+esc(n.ssid)+'</span><span class="rssi">'+n.rssi+' dBm</span>';
      i.onclick=function(){document.querySelectorAll('.wifi-item').forEach(function(x){x.classList.remove('sel');});i.classList.add('sel');document.getElementById('wifi-ssid').value=n.ssid;};
      l.appendChild(i);});}
    else{l.innerHTML='<div class="msg info">未发现网络</div>';}}
  catch(e){l.innerHTML='<div class="msg err">扫描失败</div>';}}
async function saveWiFi(){
  var s=document.getElementById('wifi-ssid').value.trim();var p=document.getElementById('wifi-pass').value;
  if(!s){msg('wifi-msg','请输入网络名称','err');return;}
  try{var r=await fetch('/api/wifi/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ssid:s,password:p})});
    var d=await r.json();if(d.success){msg('wifi-msg','已保存！正在重启...','ok');}else{msg('wifi-msg',d.error,'err');}}
  catch(e){msg('wifi-msg','保存失败','err');}}

/* 均衡器 */
var BANDS=5,FREQS=['80','250','1k','4k','12k'],gains=new Array(BANDS).fill(0),dirty=false;
function fmtGain(v){return (v>0?'+':'')+v;}
function buildSliders(){
  var c=document.getElementById('eq-sliders');c.innerHTML='';
  for(var i=0;i<BANDS;i++){
    var d=document.createElement('div');d.className='eq-row';
    var f=document.createElement('span');f.className='freq';f.textContent=FREQS[i]+'Hz';
    var s=document.createElement('input');s.type='range';s.min=-15;s.max=15;s.step=1;s.value=gains[i];s.dataset.band=i;
    s.addEventListener('input',function(e){var b=parseInt(e.target.dataset.band);gains[b]=parseFloat(e.target.value);document.getElementById('val-'+b).textContent=fmtGain(gains[b]);dirty=true;document.getElementById('apply-btn').disabled=false;});
    var v=document.createElement('span');v.className='val';v.id='val-'+i;v.textContent=fmtGain(gains[i]);
    d.appendChild(f);d.appendChild(s);d.appendChild(v);c.appendChild(d);
  }
}
function updateSliders(){for(var i=0;i<BANDS;i++){var s=document.querySelector('[data-band="'+i+'"]');if(s)s.value=gains[i];var v=document.getElementById('val-'+i);if(v)v.textContent=fmtGain(gains[i]);}dirty=false;document.getElementById('apply-btn').disabled=true;}

/* 测速 */
function stLog(s){var l=document.getElementById('st-log');l.textContent+=s+'\n';l.scrollTop=l.scrollHeight;}
function fmtBytes(n){if(n>=1048576)return (n/1048576).toFixed(2)+' MB';if(n>=1024)return (n/1024).toFixed(1)+' KB';return n+' B';}
function fmtMs(ms){return ms.toFixed(2)+' ms';}
var playing=false;
function checkBusy(){if(playing){msg('st-msg','⚠️ 正在播放，测速会占用带宽，建议暂停后再测','err');return true;}return false;}
async function runPing(){
  if(checkBusy())return;
  var btn=document.getElementById('b-ping');btn.disabled=true;
  var N=20,samples=[];
  try{
    for(var i=0;i<N;i++){
      var t0=performance.now();
      await fetch('/api/speedtest/ping?'+Math.random(),{cache:'no-store'});
      samples.push(performance.now()-t0);
      await new Promise(function(r){setTimeout(r,50);});
    }
    if(samples.length){
      var mn=Math.min.apply(null,samples),mx=Math.max.apply(null,samples);
      var avg=samples.reduce(function(a,b){return a+b;},0)/samples.length;
      var v=samples.reduce(function(a,b){return a+(b-avg)*(b-avg);},0)/samples.length;
      var sd=Math.sqrt(v);
      document.getElementById('p-avg').textContent=fmtMs(avg);
      stLog('ping n='+samples.length+' min='+mn.toFixed(2)+' avg='+avg.toFixed(2)+' max='+mx.toFixed(2)+' sd='+sd.toFixed(2)+' ms');
    }
  }catch(e){stLog('ping err: '+e);}
  btn.disabled=false;
}
async function runDownload(){
  if(checkBusy())return;
  var btn=document.getElementById('b-dl');btn.disabled=true;
  var bytes=1048576;
  document.getElementById('dl-mbps').textContent='0.00';
  var t0=performance.now();
  try{
    var resp=await fetch('/api/speedtest/download?bytes='+bytes+'&_='+Math.random(),{cache:'no-store'});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    var reader=resp.body.getReader(),got=0;
    while(true){var r=await reader.read();if(r.done)break;got+=r.value.length;var dt=(performance.now()-t0)/1000;if(dt>0)document.getElementById('dl-mbps').textContent=((got*8/1e6)/dt).toFixed(2);}
    var dt=(performance.now()-t0)/1000;
    document.getElementById('dl-mbps').textContent=((got*8/1e6)/dt).toFixed(2);
    stLog('download '+fmtBytes(got)+' in '+(dt*1000).toFixed(0)+' ms = '+((got*8/1e6)/dt).toFixed(2)+' Mbit/s');
  }catch(e){stLog('dl err: '+e.message);}
  btn.disabled=false;
}
async function runUpload(){
  if(checkBusy())return;
  var btn=document.getElementById('b-ul');btn.disabled=true;
  var bytes=1048576;
  document.getElementById('ul-mbps').textContent='0.00';
  var payload=new Uint8Array(bytes);
  for(var i=0;i<bytes;i+=4){payload[i]=(i*73)&0xff;}
  var t0=performance.now();
  try{
    var resp=await fetch('/api/speedtest/upload',{method:'POST',body:payload,headers:{'Content-Type':'application/octet-stream'}});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    var dt=(performance.now()-t0)/1000;
    var txt=await resp.text();
    document.getElementById('ul-mbps').textContent=((bytes*8/1e6)/dt).toFixed(2);
    stLog('upload '+fmtBytes(bytes)+' in '+(dt*1000).toFixed(0)+' ms = '+((bytes*8/1e6)/dt).toFixed(2)+' Mbit/s (server: '+txt.trim()+')');
  }catch(e){stLog('ul err: '+e.message);}
  btn.disabled=false;
}

/* 状态信息 */
function rssiLabel(r){if(r==null)return '-';var q='';if(r>=-55)q='（极佳）';else if(r>=-65)q='（良好）';else if(r>=-75)q='（一般）';else q='（较差）';return r+' dBm '+q;}
function fmtUptime(s){if(s==null)return '-';var d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return (d?d+'天 ':'')+(d||h?h+'小时 ':'')+m+'分 '+(s%60)+'秒';}
async function loadInfo(){
  try{var r=await fetch('/api/system/info');var d=await r.json();
    if(d.success){var i=d.info;
      document.getElementById('st-net').textContent=i.eth_connected?'以太网':(i.wifi_connected?'WiFi':'未连接');
      document.getElementById('st-ip').textContent=i.ip||'-';
      document.getElementById('st-rssi').textContent=rssiLabel(i.wifi_rssi);
      document.getElementById('st-dac').textContent=(i.uac_ready===undefined)?'-':(i.uac_ready?'已连接':'未检测到');
      document.getElementById('st-play').textContent=i.playing?'播放中':'空闲';
      playing=!!i.playing;
      document.getElementById('info-name').textContent=i.device_name||'-';
      document.getElementById('info-fw').textContent=i.firmware_version||'-';
      document.getElementById('info-uptime').textContent=fmtUptime(i.uptime_s);
      document.getElementById('info-heap').textContent=Math.round(i.free_heap/1024)+' KB';
      document.getElementById('info-chan').textContent=i.wifi_channel||'-';
      document.getElementById('info-mac').textContent=i.mac||'-';
      document.getElementById('dev-name').placeholder=i.device_name||'';
      if(i.dual_supported&&!dualLoaded){dualLoaded=true;loadDual();}}}catch(e){}}
